# D0-D1: read-only Quantum ESPRESSO discovery API, not a compute server.
# Default: loopback only. LAN binding requires deliberate QE_API_BIND_IP and
# QE_ALLOWED_HOSTS settings. Never expose this HTTP port to the internet.
services:
  qe-api:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        QE_DEB_VERSION: "${QE_DEB_VERSION:-6.7-3+b1}"
    image: kristalyapi-qe-api:d0-d1
    ports:
      - "${QE_API_BIND_IP:-127.0.0.1}:${QE_API_PORT:-8000}:8000"
    environment:
      QE_ALLOWED_ORIGINS: "${QE_ALLOWED_ORIGINS:-https://alorak.github.io}"
      QE_ALLOWED_HOSTS: "${QE_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      QE_PROBE_TIMEOUT: "8"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
