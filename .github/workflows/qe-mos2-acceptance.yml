name: QE MoS2 acceptance (D2.2 / D2.2b / D2.2c / D3 / D4 / D4.1, manual)

on:
  workflow_dispatch:
    inputs:
      protocol:
        description: "Fixed scientific protocol; d41 runs six independent electronic cases"
        required: true
        default: d22
        type: choice
        options:
          - d22
          - d22b
          - d22b-extended
          - d22c
          - d3
          - d4
          - d41
      mo_sha256:
        description: "Pre-reviewed SHA-256 of official PSlibrary Mo.pbe-spn-rrkjus_psl.1.0.0.UPF"
        required: true
        type: string
      s_sha256:
        description: "Pre-reviewed SHA-256 of official PSlibrary S.pbe-n-rrkjus_psl.1.0.0.UPF"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qe-mos2-d22-scientific-acceptance
  cancel-in-progress: false

jobs:
  real-mos2-scf:
    if: ${{ inputs.protocol != 'd41' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.protocol == 'd3' || inputs.protocol == 'd4') && 240 || inputs.protocol == 'd22c' && 180 || 100 }}
    env:
      MO_SHA256: ${{ inputs.mo_sha256 }}
      S_SHA256: ${{ inputs.s_sha256 }}
      MOS2_ACCEPTANCE_PROTOCOL: ${{ inputs.protocol || 'd22' }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
      - name: Python for no-dependency scientific acceptance harness
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate operator-supplied hash inputs
        run: |
          python3 - <<'PY'
          import os, re, json
          for element in ("MO","S"):
              value = os.environ[element+"_SHA256"]
              assert re.fullmatch(r"[0-9a-fA-F]{64}",value), element+" requires a SHA-256"
          if os.environ['MOS2_ACCEPTANCE_PROTOCOL'] in ('d3','d4'):
              name = 'mos2-relax-acceptance.json' if os.environ['MOS2_ACCEPTANCE_PROTOCOL'] == 'd3' else 'mos2-electronic-acceptance.json'
              plan = json.load(open('tests/fixtures/qe/'+name))
              for element in ('Mo', 'S'):
                  assert os.environ[element.upper()+'_SHA256'].lower() == plan['pseudopotentials'][element]['reviewed_sha256']
          PY
      - name: Run real Docker/API MoS2 SCF jobs for the selected fixed protocol
        if: ${{ inputs.protocol != 'd3' && inputs.protocol != 'd4' }}
        run: |
          python3 tools/qe_mos2_acceptance.py --run \
            --protocol "$MOS2_ACCEPTANCE_PROTOCOL" \
            --mo-sha256 "$MO_SHA256" --s-sha256 "$S_SHA256" \
            --output validation-results/qe-mos2-scf
      - name: Run D3 only after the fixed D2.2c reference passes
        if: ${{ inputs.protocol == 'd3' }}
        run: python3 tools/qe_relax_acceptance.py --run --output validation-results/qe-mos2-scf
      - name: Independently reverify raw QE/API/hash evidence offline
        if: ${{ inputs.protocol != 'd3' && inputs.protocol != 'd4' }}
        run: python3 tools/qe_mos2_acceptance.py --verify validation-results/qe-mos2-scf --protocol "$MOS2_ACCEPTANCE_PROTOCOL"
      - name: Independently verify D3 raw geometry, force and high-cutoff evidence
        if: ${{ inputs.protocol == 'd3' }}
        run: python3 tools/qe_relax_acceptance.py --verify validation-results/qe-mos2-scf
      - name: Run D4 only after the source-fixed D3 reference passes
        if: ${{ inputs.protocol == 'd4' }}
        run: python3 tools/qe_electronic_acceptance.py --run --output validation-results/qe-mos2-scf
      - name: Independently verify raw bands, DOS and atomic orbital PDOS
        if: ${{ inputs.protocol == 'd4' }}
        run: python3 tools/qe_electronic_acceptance.py --verify validation-results/qe-mos2-scf
      - name: Retain evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-mos2-scf-${{ inputs.protocol || 'd22' }}-${{ github.run_number }}
          path: validation-results/qe-mos2-scf/
          retention-days: 30
          if-no-files-found: warn

  electronic-convergence-case:
    if: ${{ inputs.protocol == 'd41' }}
    runs-on: ubuntu-latest
    timeout-minutes: 250
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case_id:
          - nbnd32-k16-s010
          - nbnd40-k16-s010
          - nbnd40-k18-s010
          - nbnd40-k24-s010
          - nbnd40-k24-s005
          - nbnd40-k24-s0025
    env:
      MO_SHA256: ${{ inputs.mo_sha256 }}
      S_SHA256: ${{ inputs.s_sha256 }}
      D41_CASE_ID: ${{ matrix.case_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate reviewed UPF hashes and frozen D4 reference
        run: |
          python - <<'PYTHON'
          import json, os
          plan = json.load(open('tests/fixtures/qe/mos2-electronic-convergence.json'))
          for element in ('Mo', 'S'):
              assert os.environ[element.upper()+'_SHA256'].lower() == plan['pseudopotentials'][element]['reviewed_sha256']
          PYTHON
          python tools/qe_electronic_convergence.py --preflight
      - name: Run independent Docker/API job with fixed settings
        run: python tools/qe_electronic_convergence.py --run-case "$D41_CASE_ID" --output validation-results/qe-mos2-d41
      - name: Retain case raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-d41-case-${{ matrix.case_id }}
          path: validation-results/qe-mos2-d41/
          retention-days: 30
          if-no-files-found: warn

  electronic-convergence-report:
    if: ${{ always() && inputs.protocol == 'd41' }}
    needs: electronic-convergence-case
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: qe-d41-case-*
          path: validation-results/qe-mos2-d41/
          merge-multiple: true
      - name: Compare complete cohort and independently verify the report
        if: always()
        run: |
          mkdir -p validation-results/qe-mos2-d41
          if [ ! -f validation-results/qe-mos2-d41/plan.json ]; then
            cp tests/fixtures/qe/mos2-electronic-convergence.json validation-results/qe-mos2-d41/plan.json
          fi
          python tools/qe_electronic_convergence.py --report validation-results/qe-mos2-d41
          python tools/qe_electronic_convergence.py --verify validation-results/qe-mos2-d41
      - name: Retain cohort, comparisons and all raw failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-mos2-d41-${{ github.run_number }}
          path: validation-results/qe-mos2-d41/
          retention-days: 30
          if-no-files-found: warn
