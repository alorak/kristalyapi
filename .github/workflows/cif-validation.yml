name: CIF crystal accuracy · Gemmi reference

on:
  # Run only after a PR is merged into main, using the trusted merge commit.
  pull_request_target:
    types: [closed]
    branches: [main]
    paths:
      - 'index.html'
      - 'crystal-app.js'
      - 'tests/validation/**'
      - '.github/workflows/cif-validation.yml'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail the job if any CIF mismatch or inconclusive result occurs'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cif-accuracy-${{ github.event.pull_request.merge_commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  scientific-validation:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: 30 real + 10 synthetic CIF accuracy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.pull_request.merge_commit_sha }}

      - name: Install Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned independent scientific test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            gemmi==0.7.4 numpy==2.1.3 scipy==1.15.3 \
            scikit-image==0.25.2 ase==3.26.0

      - name: Validate measurement engine and pinned fixtures
        run: python -m unittest discover -s tests/validation -p 'test_*.py' -v

      - name: Validate headless CIF extraction against UI bootstrap changes
        run: node --test tests/validation/test_runner.cjs

      - name: Run browser vs Gemmi CIF scientific gate
        env:
          STRICT_MODE: ${{ inputs.strict || 'false' }}
        shell: bash
        run: |
          if [ "$STRICT_MODE" = 'true' ]; then
            python tests/validation/validate.py --out-dir validation-results --strict
          else
            python tests/validation/validate.py --out-dir validation-results --gate
          fi

      - name: Generate unified scientific and visual-status report
        if: always()
        shell: bash
        run: |
          if [ -f validation-results/report.json ]; then
            python tests/validation/combined_report.py --scientific validation-results/report.json --out validation-results/combined-report.json
          fi

      - name: Upload detailed reference, metrics and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cif-accuracy-${{ github.run_number }}
          path: validation-results/
          if-no-files-found: warn
          retention-days: 30
