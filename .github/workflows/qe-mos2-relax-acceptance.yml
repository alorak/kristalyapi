name: QE MoS2 D3 real relaxation acceptance (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qe-mos2-d3-scientific-acceptance
  cancel-in-progress: false

jobs:
  real-relax-scf:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run only after the source-fixed D2.2c reference passes
        run: python3 tools/qe_relax_acceptance.py --run --output validation-results/qe-mos2-relax-scf
      - name: Independently verify raw relaxation, geometry, forces and high-cutoff SCF
        run: python3 tools/qe_relax_acceptance.py --verify validation-results/qe-mos2-relax-scf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qe-mos2-d3-relax-${{ github.run_number }}
          path: validation-results/qe-mos2-relax-scf/
          retention-days: 30
          if-no-files-found: warn
