name: QE pull request regression tests (no DFT)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/qe-pr-tests.yml'
      - 'server/**'
      - 'tools/qe_*.py'
      - 'tests/**'
      - 'qe-*.js'
      - 'crystal-app.js'
      - 'index.html'
      - 'styles.css'
      - 'dft-workspace.css'
      - 'validation-results/qe-*/**'

permissions:
  contents: read

concurrency:
  group: qe-pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded API test dependencies
        run: python -m pip install fastapi==0.115.11 httpx==0.28.1
      - name: Run QE unit and process regression tests with synthetic solvers
        run: python -m unittest discover -s tests -p 'test_qe_*.py' -v
      - name: Run frontend and production CIF parser regressions
        run: node --test tests/*.test.* tests/validation/test_runner.cjs
      - name: Reverify committed real D3 evidence without running DFT
        run: python tools/qe_relax_acceptance.py --verify validation-results/qe-mos2-d3-20261029-amd64
      - name: Reverify committed real D4 spectra when present
        run: |
          if [ -d validation-results/qe-mos2-d4-20261029-amd64 ]; then
            python tools/qe_electronic_acceptance.py --verify validation-results/qe-mos2-d4-20261029-amd64
          fi
      - name: Rebuild D5 initial candidates when present
        run: |
          if [ -f tools/qe_defect_prepare.py ]; then
            python tools/qe_defect_prepare.py --verify validation-results/qe-mos2-d5-preparation-20261029
          fi
      - name: Reverify accepted D4.1 raw cohort and exported view without DFT
        run: |
          python tools/qe_electronic_convergence.py --verify validation-results/qe-mos2-d41-20261030-amd64
          python tools/qe_convergence_view.py validation-results/qe-mos2-d41-20261030-amd64 --output /tmp/qe-convergence-view.json
          cmp validation-results/qe-mos2-d41-20261030-amd64/convergence-view.json /tmp/qe-convergence-view.json
      - name: Reverify archived real Si spin channels without executing QE
        run: python tools/qe_spin_acceptance.py --verify validation-results/qe-spin-si-20261030-arm64
      - name: Validate D4.1 preregistered plan and pinned raw reference without DFT
        run: python tools/qe_electronic_convergence.py --preflight

  dft-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 @spglib/moyo-wasm@0.21.0
          npx playwright install --with-deps chromium
          cp node_modules/@spglib/moyo-wasm/moyo_wasm.js vendor/moyo_wasm.js
          cp node_modules/@spglib/moyo-wasm/moyo_wasm_bg.wasm vendor/moyo_wasm_bg.wasm
      - name: Verify dedicated DFT routes and mounted forms without calculations
        run: node tests/browser/dft-workspace.test.mjs
      - name: Retain DFT screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dft-workspace-browser
          path: tests/browser/artifacts/dft-workspace-*.png
          if-no-files-found: warn
          retention-days: 14
