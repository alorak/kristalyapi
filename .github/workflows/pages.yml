name: Validate and deploy crystal studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run native regression tests
        run: node --test tests/core.test.cjs tests/worker.test.mjs
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local Moyo WASM science library
        run: npm install --no-save --ignore-scripts @spglib/moyo-wasm@0.21.0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage local scientific engine and site
        run: |
          mkdir -p public/vendor
          cp index.html public/index.html
          cp node_modules/@spglib/moyo-wasm/moyo_wasm.js public/vendor/moyo_wasm.js
          cp node_modules/@spglib/moyo-wasm/moyo_wasm_bg.wasm public/vendor/moyo_wasm_bg.wasm
          cp licenses/LICENSE-MOYO-MIT.txt public/vendor/LICENSE-MIT.txt
          cp licenses/LICENSE-MOYO-APACHE.txt public/vendor/LICENSE-APACHE.txt
          test -s public/vendor/moyo_wasm_bg.wasm
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
