name: Validate and deploy crystal studio

on:
  # Run privileged Pages deployment only for a PR already merged into main.
  # Never check out a pull request head on this privileged event.
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run native regression tests
        run: node --test tests/qe-job-diagnostics-view.test.mjs tests/qe-convergence-view.test.mjs tests/qe-defect-preparation.test.mjs tests/qe-relax-view.test.mjs tests/core.test.cjs tests/volume-worker.test.cjs tests/offline.test.mjs tests/worker.test.mjs tests/reciprocal.test.mjs tests/lesson-core.test.mjs tests/semiconductor-p0.test.mjs tests/mos2-study.test.mjs tests/qe-electronic-view.test.mjs tests/qe-defect-compare-view.test.mjs tests/qe-api-client.test.mjs tests/pages-assets.test.mjs tests/xrd-factor.test.mjs tests/coordination-reference.test.cjs tests/validation/test_runner.cjs
      - name: Set up Python for independent Gemmi reference
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test local QE runner without actual DFT
        run: python -m unittest discover -s tests -p 'test_qe_runner.py' -v
      - name: Test QE atom and orbital PDOS parser (mocked data)
        run: python -m unittest discover -s tests -p 'test_qe_pdos.py' -v
      - name: Test QE electronic pipeline (mocked solver; no scientific results)
        run: python -m unittest discover -s tests -p 'test_qe_pipeline.py' -v
      - name: Test MoS2 defect-series comparison (synthetic manifests)
        run: python -m unittest discover -s tests -p 'test_qe_defect_compare.py' -v
      - name: Install pinned FastAPI discovery test dependencies
        run: python -m pip install fastapi==0.115.11 httpx==0.28.1
      - name: Test read-only QE discovery API and binary smoke contract
        run: python -m unittest discover -s tests -p 'test_qe_api.py' -v
      - name: Test authenticated QE SCF queue/worker (synthetic fake solver only)
        run: python -m unittest discover -s tests -p 'test_qe_jobs.py' -v
      - name: Test real SCF evidence rejection rules without running DFT
        run: python -m unittest discover -s tests -p 'test_qe_scf_acceptance.py' -v
      - name: Test D2.2 MoS2 acceptance evidence gates (synthetic negatives only)
        run: python -m unittest discover -s tests -p 'test_qe_mos2_acceptance.py' -v
      - name: Test fixed-cell relaxation worker and force gates
        run: python -m unittest discover -s tests -p 'test_qe_relax.py' -v
      - name: Test MoS2 relaxation acceptance evidence rejection
        run: python -m unittest discover -s tests -p 'test_qe_relax_acceptance.py' -v
      - name: Test bounded electronic API pipeline execution
        run: python -m unittest discover -s tests -p 'test_qe_electronic_jobs.py' -v
      - name: Test electronic acceptance raw evidence rejection
        run: python -m unittest discover -s tests -p 'test_qe_electronic_acceptance.py' -v
      - name: Test safe stage-boundary checkpoints and pause/resume
        run: python -m unittest discover -s tests -p 'test_qe_checkpoint.py' -v
      - name: Test worker job diagnostics
        run: python -m unittest discover -s tests -p 'test_qe_job_diagnostics.py' -v
      - name: Test convergence view raw evidence export
        run: python -m unittest discover -s tests -p 'test_qe_convergence_view.py' -v
      - name: Test bounded DOS controls and D4.1 convergence decisions
        run: |
          python -m unittest discover -s tests -p 'test_qe_dos_settings.py' -v
          python -m unittest discover -s tests -p 'test_qe_electronic_convergence.py' -v
      - name: Test bounded acceptance artifact transport
        run: python -m unittest discover -s tests -p 'test_qe_acceptance_runtime.py' -v
      - name: Test source-fixed MoS2 defect preparation
        run: python -m unittest discover -s tests -p 'test_qe_defect_prepare.py' -v
      - name: Test initialization-only defect pilot rejection and cleanup
        run: python -m unittest discover -s tests -p 'test_qe_defect_init.py' -v
      - name: Rebuild and verify initial defect candidates
        run: python tools/qe_defect_prepare.py --verify validation-results/qe-mos2-d5-preparation-20261029
      - name: Validate Docker Compose configuration without building the heavy QE image
        run: docker compose -f compose.qe.yml config --quiet
      - name: Install pinned Gemmi map reference
        run: python -m pip install gemmi==0.7.5 numpy==2.1.3
      - name: Validate real MTZ reflection columns and weighted maps against Gemmi
        run: python tests/validation/mtz_gemmi_reference.py
      - name: Validate CCP4/MRC axis, origin and voxel data against independent Gemmi
        run: python tests/validation/ccp4_gemmi_reference.py
      - name: Gate final scientific isosurface geometry against analytic and real Gemmi reference maps
        run: python tests/validation/volume_surface_reference.py
      - name: Gate 32/48/64 full-grid scientific convergence and periodic seam topology
        run: python tests/validation/volume_highres_reference.py
      - name: Install independent marching-cubes scientific reference
        run: python -m pip install scikit-image==0.25.2 scipy==1.15.3
      - name: Gate independent marching-cubes geometry and fragmentation on real maps
        run: python tests/validation/volume_independent_reference.py
      - name: Test source-fixed signed sampling and physical-grid invariants
        run: python -m unittest discover -s tests/validation -p 'test_volume_sampling.py' -v
      - name: Diagnose real-map peak retention, threshold sensitivity and spectral sampling
        run: python tests/validation/volume_sampling_reference.py
      - name: Install pinned independent ASE format readers
        run: python -m pip install ase==3.26.0
      - name: Test real-format numeric mismatch detection
        run: python -m unittest discover -s tests/validation -p 'test_volume_vesta_formats.py' -v
      - name: Gate upstream CHGCAR/CUBE/XSF arrays and affine frames against ASE
        run: python tests/validation/volume_vesta_formats_reference.py
      - name: Gate real CUBE atom positions, independent ASE XSF and audit 40/64 Worker cost
        run: python tests/validation/volume_109_reference.py
      - name: Gate P11 multiple CUBE orbitals and molecular multi-field XSF against ASE
        run: python tests/validation/volume_11_reference.py
      - name: Gate P12 bond-valence parameters and occupied periodic image sets against ASE
        run: python tests/validation/bvs_12_reference.py
      - name: Gate P13 source-fixed experimental CIF structures and mixed-center BVS against Gemmi + ASE
        run: python tests/validation/bvs_13_experimental.py
      - name: Gate P14 official VESTA-manual geometric/BVS equations against independent real-CIF ASE data
        run: python tests/validation/vesta_14_manual_reference.py
      - name: Reject uncaptured or unversioned VESTA GUI evidence
        run: python -m unittest discover -s tests/validation -p 'test_vesta_14_gui_evidence.py' -v
      - name: Archive Package 10.8 scientific convergence measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volume-convergence-${{ github.run_number }}
          path: |
            validation-results/volume-surface-10-8.json
            validation-results/volume-highres-10-8-3.json
            validation-results/volume-independent-10-8-4.json
            validation-results/volume-sampling-10-8-5.json
            validation-results/volume-vesta-formats-10-8-6.json
            validation-results/volume-109-real-format-and-cost.json
            validation-results/volume-11-multifield-scientific.json
            validation-results/bvs-12-ase-ion-pairs.json
            validation-results/bvs-13-experimental-cif-ase-gemmi.json
            validation-results/vesta-14-manual-reference.json
            validation-results/vesta-14-difference-matrix.csv
          if-no-files-found: warn
          retention-days: 30

  deploy:
    needs: validate
    if: github.event.pull_request.merged == true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local Moyo WASM science library
        run: npm install --no-save --ignore-scripts @spglib/moyo-wasm@0.21.0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Reverify accepted D4.1 raw cohort and exported view without DFT
        run: |
          python tools/qe_electronic_convergence.py --verify validation-results/qe-mos2-d41-20261030-amd64
          python tools/qe_convergence_view.py validation-results/qe-mos2-d41-20261030-amd64 --output /tmp/qe-convergence-view.json
          cmp validation-results/qe-mos2-d41-20261030-amd64/convergence-view.json /tmp/qe-convergence-view.json
      - name: Stage local scientific engine and site
        run: |
          mkdir -p public/vendor
          cp index.html public/index.html
          cp styles.css public/styles.css
          cp dft-workspace.css public/dft-workspace.css
          cp semiconductor-p0.css public/semiconductor-p0.css
          cp sw.js public/sw.js
          cp manifest.webmanifest public/manifest.webmanifest
          cp crystal-app.js public/crystal-app.js
          cp qe-electronic-view.js public/qe-electronic-view.js
          cp qe-convergence-view.js public/qe-convergence-view.js
          cp qe-job-diagnostics-view.js public/qe-job-diagnostics-view.js
          cp qe-job-tracking.js public/qe-job-tracking.js
          cp qe-defect-compare-view.js public/qe-defect-compare-view.js
          cp qe-api-client.js public/qe-api-client.js
          cp qe-relax-view.js public/qe-relax-view.js
          cp mos2-defect-study-core.js public/mos2-defect-study-core.js
          cp volume-iso-worker.js public/volume-iso-worker.js
          cp reciprocal-core.js public/reciprocal-core.js
          cp reciprocal-page.js public/reciprocal-page.js
          cp lesson-core.js public/lesson-core.js
          cp xrd-factor-core.js public/xrd-factor-core.js
          cp lesson-pages.js public/lesson-pages.js
          cp semiconductor-p0.js public/semiconductor-p0.js
          cp semiconductor-physics-p0-core.js public/semiconductor-physics-p0-core.js
          cp powder-planes-view.js public/powder-planes-view.js
          cp favicon.svg public/favicon.svg
          cp translations.js public/translations.js
          cp -R vendor/three public/vendor/three
          cp node_modules/@spglib/moyo-wasm/moyo_wasm.js public/vendor/moyo_wasm.js
          cp node_modules/@spglib/moyo-wasm/moyo_wasm_bg.wasm public/vendor/moyo_wasm_bg.wasm
          cp licenses/LICENSE-MOYO-MIT.txt public/vendor/LICENSE-MIT.txt
          cp licenses/LICENSE-MOYO-APACHE.txt public/vendor/LICENSE-APACHE.txt
          test -s public/vendor/moyo_wasm_bg.wasm
          test -s public/vendor/three/build/three.module.js
          test -s public/vendor/three/examples/jsm/geometries/ConvexGeometry.js
          test -s public/dft-workspace.css
          test -s public/sw.js
          test -s public/manifest.webmanifest
          test -s public/lesson-core.js
          test -s public/xrd-factor-core.js
          test -s public/lesson-pages.js
          test -s public/semiconductor-p0.js
          test -s public/semiconductor-physics-p0-core.js
          test -s public/qe-electronic-view.js
          test -s public/qe-convergence-view.js
          test -s public/qe-job-diagnostics-view.js
          test -s public/qe-job-tracking.js
          test -s public/qe-defect-compare-view.js
          test -s public/qe-api-client.js
          test -s public/qe-relax-view.js
          test -s public/mos2-defect-study-core.js
          test -s public/semiconductor-p0.css
          test -s public/powder-planes-view.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
