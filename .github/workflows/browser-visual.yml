name: Real browser WebGL visual smoke

on:
  # Validate the exact trusted merge commit after a PR is merged into main.
  pull_request_target:
    types: [closed]
    branches: [main]
    paths:
      - 'index.html'
      - 'reciprocal-core.js'
      - 'reciprocal-page.js'
      - 'lesson-core.js'
      - 'xrd-factor-core.js'
      - 'lesson-pages.js'
      - 'powder-planes-view.js'
      - 'crystal-app.js'
      - 'volume-iso-worker.js'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'translations.js'
      - 'vendor/three/**'
      - '.github/workflows/pages.yml'
      - 'tests/browser/**'
      - 'tests/offline.test.mjs'
      - 'tests/xrd-factor.test.mjs'
      - '.github/workflows/browser-visual.yml'

permissions:
  contents: read

jobs:
  browser-visual:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and local Moyo WASM bundle
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 @spglib/moyo-wasm@0.21.0
          npx playwright install --with-deps chromium
          mkdir -p vendor
          cp node_modules/@spglib/moyo-wasm/moyo_wasm.js vendor/moyo_wasm.js
          cp node_modules/@spglib/moyo-wasm/moyo_wasm_bg.wasm vendor/moyo_wasm_bg.wasm
      - name: Verify linked education labs in Chromium
        run: node tests/browser/lesson-labs.test.mjs
      - name: Render real WebGL scenes and compare screenshots
        id: visual
        run: node tests/browser/visual.test.mjs
      - name: Record explicit visual outcome
        if: always()
        env:
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
        run: |
          mkdir -p tests/browser/artifacts
          node - <<'NODE'
          const fs = require('node:fs');
          const outcome = process.env.VISUAL_OUTCOME;
          const status = outcome === 'success' ? 'pass' : outcome === 'failure' ? 'fail' : 'not_run';
          fs.writeFileSync('tests/browser/artifacts/visual-status.json',
            JSON.stringify({status, outcome, source:'browser-visual.yml'}, null, 2) + '\n');
          NODE
      - name: Verify Service Worker asset isolation and cache lifecycle
        run: node --test tests/offline.test.mjs
      - name: Upload screenshots and pixel metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-visual-smoke
          path: tests/browser/artifacts/
          if-no-files-found: warn
          retention-days: 14
