name: QE Docker D2.1 real Si SCF acceptance (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qe-container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Docker and submit five real Si SCF jobs through the authenticated API
        run: python tools/qe_scf_acceptance.py --run --output validation-results/qe-si-scf
      - name: Independently recheck raw output, API results and finite sensitivity evidence
        run: python tools/qe_scf_acceptance.py --verify validation-results/qe-si-scf
      - name: Preserve real QE acceptance evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-si-scf-d21-${{ github.run_number }}
          path: validation-results/qe-si-scf/
          if-no-files-found: error
          retention-days: 30
